<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Drop Tetris</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      background: #161b22;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #30363d;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }
    canvas#tetris {
      background: #0d1117;
      border: 2px solid #30363d;
      border-radius: 6px;
      display: block;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 140px;
    }
    .panel-box {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .panel-box h3 {
      font-size: 11px;
      text-transform: uppercase;
      color: #8b949e;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .panel-val {
      font-size: 20px;
      font-weight: 700;
      color: #58a6ff;
      font-variant-numeric: tabular-nums;
    }
    canvas#next {
      background: #0d1117;
      border-radius: 4px;
      margin: 0 auto;
      display: block;
    }
    .btn {
      background: #238636;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background: #2ea043; }
    .btn.pause { background: #30363d; }
    .btn.pause:hover { background: #388bfd; }
    .instructions {
      font-size: 11px;
      color: #8b949e;
      line-height: 1.4;
      text-align: left;
    }
    .mobile-controls {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
      width: 100%;
    }
    .mob-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 10px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    @media (max-width: 600px) {
      .game-container { flex-direction: column; align-items: center; }
      .side-panel { flex-direction: row; width: 100%; justify-content: space-between; }
      .mobile-controls { display: grid; }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div>
      <canvas id="tetris" width="240" height="480"></canvas>
      <div class="mobile-controls">
        <button class="mob-btn" id="m-left">←</button>
        <button class="mob-btn" id="m-rotate">↻</button>
        <button class="mob-btn" id="m-right">→</button>
        <button class="mob-btn" id="m-drop">↓</button>
      </div>
    </div>
    <div class="side-panel">
      <div class="panel-box">
        <h3>Next</h3>
        <canvas id="next" width="80" height="80"></canvas>
      </div>
      <div class="panel-box">
        <h3>Score</h3>
        <div class="panel-val" id="score">0</div>
      </div>
      <div class="panel-box">
        <h3>Lines</h3>
        <div class="panel-val" id="lines">0</div>
      </div>
      <div class="panel-box">
        <h3>Level</h3>
        <div class="panel-val" id="level">1</div>
      </div>
      <button class="btn pause" id="pause-btn">Pause</button>
      <button class="btn" id="restart-btn">Restart</button>
      <div class="instructions">
        ← → Move<br>
        ↑ Rotate<br>
        ↓ Soft Drop<br>
        Space: Hard Drop<br>
        P: Pause
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 24;

    const COLORS = [
      null,
      '#ef4444', // Z red
      '#10b981', // S green
      '#06b6d4', // I cyan
      '#f59e0b', // O yellow
      '#8b5cf6', // T purple
      '#3b82f6', // J blue
      '#f97316'  // L orange
    ];

    const PIECES = [
      [],
      [[1,1,0],[0,1,1],[0,0,0]], // Z
      [[0,2,2],[2,2,0],[0,0,0]], // S
      [[0,0,0,0],[3,3,3,3],[0,0,0,0],[0,0,0,0]], // I
      [[4,4],[4,4]], // O
      [[0,5,0],[5,5,5],[0,0,0]], // T
      [[6,0,0],[6,6,6],[0,0,0]], // J
      [[0,0,7],[7,7,7],[0,0,0]]  // L
    ];

    let grid = createGrid(COLS, ROWS);
    let piece = null;
    let nextPiece = null;
    let score = 0;
    let lines = 0;
    let level = 1;
    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let isPaused = false;
    let isGameOver = false;

    function createGrid(w, h) {
      const matrix = [];
      while (h--) matrix.push(new Array(w).fill(0));
      return matrix;
    }

    function randomPiece() {
      const typeId = Math.floor(Math.random() * 7) + 1;
      const matrix = PIECES[typeId].map(row => [...row]);
      return {
        matrix,
        colorIndex: typeId,
        x: Math.floor(COLS / 2) - Math.ceil(matrix[0].length / 2),
        y: 0
      };
    }

    function collide(grid, piece) {
      const m = piece.matrix;
      const o = { x: piece.x, y: piece.y };
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0) {
            const gy = y + o.y;
            const gx = x + o.x;
            if (gy >= ROWS || gx < 0 || gx >= COLS || (gy >= 0 && grid[gy][gx] !== 0)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    function merge(grid, piece) {
      piece.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0 && y + piece.y >= 0) {
            grid[y + piece.y][x + piece.x] = piece.colorIndex;
          }
        });
      });
    }

    function rotate(matrix) {
      const N = matrix.length;
      const result = matrix.map((_, i) => matrix.map(row => row[i]).reverse());
      return result;
    }

    function playerRotate() {
      if (isPaused || isGameOver) return;
      const pos = piece.x;
      let offset = 1;
      const oldMatrix = piece.matrix;
      piece.matrix = rotate(piece.matrix);
      while (collide(grid, piece)) {
        piece.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > piece.matrix[0].length) {
          piece.matrix = oldMatrix;
          piece.x = pos;
          return;
        }
      }
    }

    function arenaSweep() {
      let rowCount = 0;
      outer: for (let y = grid.length - 1; y >= 0; --y) {
        for (let x = 0; x < grid[y].length; ++x) {
          if (grid[y][x] === 0) continue outer;
        }
        const row = grid.splice(y, 1)[0].fill(0);
        grid.unshift(row);
        ++y;
        rowCount++;
      }
      if (rowCount > 0) {
        const points = [0, 40, 100, 300, 1200];
        score += (points[rowCount] || 40) * level;
        lines += rowCount;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(120, 1000 - (level - 1) * 80);
        updateScore();
      }
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
      document.getElementById('lines').textContent = lines;
      document.getElementById('level').textContent = level;
    }

    function playerDrop() {
      if (isPaused || isGameOver) return;
      piece.y++;
      if (collide(grid, piece)) {
        piece.y--;
        merge(grid, piece);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerHardDrop() {
      if (isPaused || isGameOver) return;
      while (!collide(grid, piece)) {
        piece.y++;
      }
      piece.y--;
      merge(grid, piece);
      playerReset();
      arenaSweep();
      dropCounter = 0;
    }

    function playerMove(dir) {
      if (isPaused || isGameOver) return;
      piece.x += dir;
      if (collide(grid, piece)) {
        piece.x -= dir;
      }
    }

    function playerReset() {
      piece = nextPiece || randomPiece();
      nextPiece = randomPiece();
      drawNext();
      if (collide(grid, piece)) {
        isGameOver = true;
      }
    }

    function restart() {
      grid = createGrid(COLS, ROWS);
      score = 0;
      lines = 0;
      level = 1;
      dropInterval = 1000;
      isGameOver = false;
      isPaused = false;
      nextPiece = randomPiece();
      playerReset();
      updateScore();
    }

    function drawGhost() {
      if (!piece) return;
      const ghost = { ...piece, y: piece.y };
      while (!collide(grid, ghost)) {
        ghost.y++;
      }
      ghost.y--;
      ghost.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.fillRect((ghost.x + x) * BLOCK, (ghost.y + y) * BLOCK, BLOCK - 1, BLOCK - 1);
          }
        });
      });
    }

    function drawMatrix(matrix, offset, context, colorIndex) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = COLORS[colorIndex || value];
            context.fillRect((offset.x + x) * BLOCK, (offset.y + y) * BLOCK, BLOCK - 1, BLOCK - 1);
            context.fillStyle = 'rgba(255, 255, 255, 0.25)';
            context.fillRect((offset.x + x) * BLOCK, (offset.y + y) * BLOCK, BLOCK - 1, 3);
          }
        });
      });
    }

    function drawNext() {
      nextCtx.fillStyle = '#0d1117';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!nextPiece) return;
      const m = nextPiece.matrix;
      const offsetX = (nextCanvas.width / BLOCK - m[0].length) / 2;
      const offsetY = (nextCanvas.height / BLOCK - m.length) / 2;
      m.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            nextCtx.fillStyle = COLORS[nextPiece.colorIndex];
            nextCtx.fillRect((offsetX + x) * BLOCK, (offsetY + y) * BLOCK, BLOCK - 1, BLOCK - 1);
          }
        });
      });
    }

    function draw() {
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid guidelines
      ctx.strokeStyle = '#161b22';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += BLOCK) {
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += BLOCK) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      drawMatrix(grid, { x: 0, y: 0 }, ctx);
      drawGhost();
      if (piece) drawMatrix(piece.matrix, { x: piece.x, y: piece.y }, ctx, piece.colorIndex);

      if (isGameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 22px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#8b949e';
        ctx.font = '13px system-ui';
        ctx.fillText('Press Restart', canvas.width / 2, canvas.height / 2 + 18);
      } else if (isPaused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#58a6ff';
        ctx.font = 'bold 20px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
      }
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      if (!isPaused && !isGameOver) {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
          playerDrop();
        }
      }

      draw();
      requestAnimationFrame(update);
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === 'ArrowLeft') playerMove(-1);
      if (e.key === 'ArrowRight') playerMove(1);
      if (e.key === 'ArrowDown') playerDrop();
      if (e.key === 'ArrowUp') playerRotate();
      if (e.key === ' ') playerHardDrop();
      if (e.key === 'p' || e.key === 'P') isPaused = !isPaused;
    });

    document.getElementById('m-left').onclick = () => playerMove(-1);
    document.getElementById('m-right').onclick = () => playerMove(1);
    document.getElementById('m-rotate').onclick = () => playerRotate();
    document.getElementById('m-drop').onclick = () => playerDrop();
    document.getElementById('restart-btn').onclick = restart;
    document.getElementById('pause-btn').onclick = () => {
      isPaused = !isPaused;
      document.getElementById('pause-btn').textContent = isPaused ? 'Resume' : 'Pause';
    };

    restart();
    requestAnimationFrame(update);
  </script>
</body>
</html>
