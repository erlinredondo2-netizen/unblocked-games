<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 16px;
    }
    .counter {
      background: #0d1117;
      color: #f85149;
      font-family: monospace;
      font-size: 22px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #30363d;
      width: 60px;
      text-align: center;
    }
    .face-btn {
      font-size: 22px;
      background: #30363d;
      border: 1px solid #484f58;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-btn:hover { background: #388bfd; }
    .grid {
      display: grid;
      gap: 2px;
      background: #30363d;
      padding: 4px;
      border-radius: 6px;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #21262d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      border-radius: 2px;
    }
    .cell:hover { background: #30363d; }
    .cell.revealed { background: #0d1117; cursor: default; }
    .cell.mine { background: #b91c1c; }
    .cell.c1 { color: #58a6ff; }
    .cell.c2 { color: #3fb950; }
    .cell.c3 { color: #f85149; }
    .cell.c4 { color: #a371f7; }
    .cell.c5 { color: #f0883e; }
    .cell.c6 { color: #1f6feb; }
    .footer-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #8b949e;
    }
    .flag-toggle {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .flag-toggle.active {
      background: #388bfd;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <div class="counter" id="mines-count">10</div>
      <button class="face-btn" id="face">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="footer-tools">
      <span>Right-click or hold to Flag 🚩</span>
      <button class="flag-toggle" id="flag-btn">Mode: Click to Reveal</button>
    </div>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const TOTAL_MINES = 10;

    let board = [];
    let revealedCount = 0;
    let flagsCount = 0;
    let isGameOver = false;
    let timerVal = 0;
    let timerId = null;
    let flagMode = false;

    const gridEl = document.getElementById('grid');
    const faceEl = document.getElementById('face');
    const minesEl = document.getElementById('mines-count');
    const timerEl = document.getElementById('timer');
    const flagBtn = document.getElementById('flag-btn');

    gridEl.style.gridTemplateColumns = `repeat(${COLS}, 32px)`;

    function initGame() {
      board = [];
      revealedCount = 0;
      flagsCount = 0;
      isGameOver = false;
      timerVal = 0;
      clearInterval(timerId);
      timerId = null;
      faceEl.textContent = '🙂';
      minesEl.textContent = String(TOTAL_MINES).padStart(2, '0');
      timerEl.textContent = '000';

      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          board[r][c] = { r, c, isMine: false, isRevealed: false, isFlagged: false, neighborMines: 0 };
        }
      }

      // Render cells
      gridEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const el = document.createElement('div');
          el.className = 'cell';
          el.dataset.r = r;
          el.dataset.c = c;
          el.addEventListener('click', () => handleCellClick(r, c));
          el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          gridEl.appendChild(el);
          board[r][c].element = el;
        }
      }
    }

    function startTimer() {
      if (timerId) return;
      timerId = setInterval(() => {
        timerVal++;
        timerEl.textContent = String(Math.min(999, timerVal)).padStart(3, '0');
      }, 1000);
    }

    function plantMines(firstR, firstC) {
      let placed = 0;
      while (placed < TOTAL_MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        // Avoid first clicked cell & immediate neighbors
        if (!board[r][c].isMine && (Math.abs(r - firstR) > 1 || Math.abs(c - firstC) > 1)) {
          board[r][c].isMine = true;
          placed++;
        }
      }

      // Count neighbors
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                  count++;
                }
              }
            }
            board[r][c].neighborMines = count;
          }
        }
      }
    }

    let firstClick = true;

    function handleCellClick(r, c) {
      if (isGameOver) return;
      if (flagMode) { toggleFlag(r, c); return; }

      const cell = board[r][c];
      if (cell.isFlagged || cell.isRevealed) return;

      if (firstClick) {
        plantMines(r, c);
        startTimer();
        firstClick = false;
      }

      if (cell.isMine) {
        // Mine hit!
        cell.isRevealed = true;
        cell.element.classList.add('revealed', 'mine');
        cell.element.textContent = '💣';
        endGame(false);
        return;
      }

      revealCell(r, c);

      // Check win
      if (revealedCount === ROWS * COLS - TOTAL_MINES) {
        endGame(true);
      }
    }

    function revealCell(r, c) {
      const cell = board[r][c];
      if (cell.isRevealed || cell.isFlagged || cell.isMine) return;

      cell.isRevealed = true;
      revealedCount++;
      cell.element.classList.add('revealed');

      if (cell.neighborMines > 0) {
        cell.element.textContent = cell.neighborMines;
        cell.element.classList.add(`c${cell.neighborMines}`);
      } else {
        // Flood fill empty neighbors
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              revealCell(nr, nc);
            }
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (isGameOver) return;
      const cell = board[r][c];
      if (cell.isRevealed) return;

      cell.isFlagged = !cell.isFlagged;
      cell.element.textContent = cell.isFlagged ? '🚩' : '';
      flagsCount += cell.isFlagged ? 1 : -1;
      minesEl.textContent = String(TOTAL_MINES - flagsCount).padStart(2, '0');
    }

    function endGame(won) {
      isGameOver = true;
      clearInterval(timerId);
      faceEl.textContent = won ? '😎' : '😵';

      if (!won) {
        // Reveal all mines
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (board[r][c].isMine) {
              board[r][c].element.textContent = '💣';
              board[r][c].element.classList.add('revealed');
            }
          }
        }
      }
    }

    faceEl.addEventListener('click', () => {
      firstClick = true;
      initGame();
    });

    flagBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      flagBtn.classList.toggle('active', flagMode);
      flagBtn.textContent = flagMode ? 'Mode: Click to Flag 🚩' : 'Mode: Click to Reveal';
    });

    initGame();
  </script>
</body>
</html>
