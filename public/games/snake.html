<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 400px;
      font-size: 15px;
      font-weight: 600;
      color: #8b949e;
    }
    .hud span strong { color: #58a6ff; font-variant-numeric: tabular-nums; }
    #canvas {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .controls-hint {
      font-size: 12px;
      color: #8b949e;
      display: flex;
      gap: 16px;
    }
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 45px);
      gap: 8px;
      margin-top: 8px;
    }
    .touch-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      border-radius: 6px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .touch-btn:active { background: #388bfd; }
    @media (max-width: 600px) {
      .touch-controls { display: grid; }
      #canvas { width: 320px; height: 320px; }
      .hud { width: 320px; }
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>High Score: <strong id="high-score">0</strong></span>
    </div>
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="controls-hint">
      <span>Controls: Arrow Keys or W A S D</span>
      <span>Space to Pause</span>
    </div>
    <div class="touch-controls">
      <div></div>
      <button class="touch-btn" id="btn-up">↑</button>
      <div></div>
      <button class="touch-btn" id="btn-left">←</button>
      <button class="touch-btn" id="btn-down">↓</button>
      <button class="touch-btn" id="btn-right">→</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');

    const GRID = 20;
    const TILE_COUNT = canvas.width / GRID;

    let snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
    let dx = 0;
    let dy = -1;
    let food = { x: 15, y: 10 };
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    highScoreEl.textContent = highScore;
    let gameLoop = null;
    let isPaused = false;
    let isGameOver = false;

    function playTone(freq, duration = 0.08) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function spawnFood() {
      while (true) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        let onSnake = snake.some(s => s.x === food.x && s.y === food.y);
        if (!onSnake) break;
      }
    }

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
      dx = 0;
      dy = -1;
      score = 0;
      scoreEl.textContent = score;
      isGameOver = false;
      isPaused = false;
      spawnFood();
    }

    function update() {
      if (isPaused || isGameOver) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision (wrap-around or wall bounce; let's do solid walls)
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        endGame();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snake_highscore', highScore);
        }
        playTone(520, 0.1);
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function endGame() {
      isGameOver = true;
      playTone(180, 0.3);
    }

    function draw() {
      ctx.fillStyle = '#161b22';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#21262d';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID);
        ctx.lineTo(canvas.width, i * GRID);
        ctx.stroke();
      }

      // Draw food
      ctx.fillStyle = '#f85149';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw snake
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? '#388bfd' : '#238636';
        ctx.beginPath();
        ctx.roundRect(part.x * GRID + 1, part.y * GRID + 1, GRID - 2, GRID - 2, index === 0 ? 6 : 4);
        ctx.fill();

        // Eyes on head
        if (index === 0) {
          ctx.fillStyle = '#ffffff';
          const eyeOffset = 5;
          ctx.beginPath();
          ctx.arc(part.x * GRID + eyeOffset, part.y * GRID + eyeOffset, 2, 0, Math.PI * 2);
          ctx.arc(part.x * GRID + GRID - eyeOffset, part.y * GRID + eyeOffset, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Overlays
      if (isGameOver) {
        ctx.fillStyle = 'rgba(13, 17, 23, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f85149';
        ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#8b949e';
        ctx.font = '14px system-ui';
        ctx.fillText('Press SPACE or Tap to Restart', canvas.width / 2, canvas.height / 2 + 20);
      } else if (isPaused) {
        ctx.fillStyle = 'rgba(13, 17, 23, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e6edf3';
        ctx.font = 'bold 22px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
      }
    }

    function tick() {
      update();
      draw();
    }

    function changeDirection(newDx, newDy) {
      if (isGameOver) { reset(); return; }
      if (newDx !== 0 && dx !== 0) return;
      if (newDy !== 0 && dy !== 0) return;
      dx = newDx;
      dy = newDy;
      playTone(380, 0.04);
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') changeDirection(0, -1);
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') changeDirection(0, 1);
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') changeDirection(-1, 0);
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') changeDirection(1, 0);
      if (e.key === ' ') {
        if (isGameOver) reset();
        else isPaused = !isPaused;
      }
    });

    document.getElementById('btn-up').onclick = () => changeDirection(0, -1);
    document.getElementById('btn-down').onclick = () => changeDirection(0, 1);
    document.getElementById('btn-left').onclick = () => changeDirection(-1, 0);
    document.getElementById('btn-right').onclick = () => changeDirection(1, 0);
    canvas.onclick = () => { if (isGameOver) reset(); };

    reset();
    gameLoop = setInterval(tick, 90);
  </script>
</body>
</html>
