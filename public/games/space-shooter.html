<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Galaxy Defender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 420px;
      font-size: 14px;
      font-weight: 600;
      color: #8b949e;
    }
    .hud strong { color: #388bfd; font-variant-numeric: tabular-nums; }
    canvas {
      background: #060911;
      border: 2px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
    }
    .hint {
      font-size: 12px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Shields: <strong id="shields">100%</strong></span>
      <span>Wave: <strong id="wave">1</strong></span>
    </div>
    <canvas id="c" width="420" height="520"></canvas>
    <div class="hint">A/D or Arrows to move. Space to Shoot.</div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const shieldsEl = document.getElementById('shields');
    const waveEl = document.getElementById('wave');

    let score = 0;
    let shields = 100;
    let wave = 1;
    let gameOver = false;

    // Player
    const player = {
      x: 210,
      y: 460,
      width: 32,
      height: 28,
      speed: 5.5,
      isShooting: false,
      shootCooldown: 0
    };

    // Stars background
    const stars = [];
    for (let i = 0; i < 70; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 1.5 + 0.5
      });
    }

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];
    let keys = {};

    function spawnWave() {
      enemies = [];
      const rows = 3 + Math.min(2, Math.floor(wave / 2));
      const cols = 6;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: 45 + c * 55,
            y: 40 + r * 45,
            width: 28,
            height: 22,
            hp: r === 0 ? 2 : 1,
            color: r === 0 ? '#f85149' : (r === 1 ? '#eab308' : '#388bfd'),
            shootTimer: Math.random() * 180 + 60
          });
        }
      }
    }

    let enemyDir = 1;
    let enemyDrop = false;

    function resetGame() {
      score = 0;
      shields = 100;
      wave = 1;
      gameOver = false;
      player.x = 210;
      bullets = [];
      enemyBullets = [];
      particles = [];
      spawnWave();
      updateHUD();
    }

    function updateHUD() {
      scoreEl.textContent = score;
      shieldsEl.textContent = `${shields}%`;
      waveEl.textContent = wave;
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 3 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 25,
          maxLife: 25,
          color: color || '#f85149'
        });
      }
    }

    function update() {
      if (gameOver) return;

      // Move stars
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
      });

      // Player movement
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
      player.x = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, player.x));

      // Player shooting
      if (player.shootCooldown > 0) player.shootCooldown--;
      if ((keys[' '] || player.isShooting) && player.shootCooldown === 0) {
        bullets.push({ x: player.x - 7, y: player.y - 10, vy: -9 });
        bullets.push({ x: player.x + 7, y: player.y - 10, vy: -9 });
        player.shootCooldown = 12;
      }

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;
        if (b.y < -10) { bullets.splice(i, 1); continue; }

        // Bullet vs Enemy
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (
            b.x > e.x - e.width/2 &&
            b.x < e.x + e.width/2 &&
            b.y > e.y - e.height/2 &&
            b.y < e.y + e.height/2
          ) {
            e.hp--;
            bullets.splice(i, 1);
            if (e.hp <= 0) {
              createExplosion(e.x, e.y, e.color);
              enemies.splice(j, 1);
              score += 100;
              updateHUD();
            }
            break;
          }
        }
      }

      // Enemies movement
      let hitEdge = false;
      const enemySpeed = 1.0 + wave * 0.2;
      enemies.forEach(e => {
        e.x += enemySpeed * enemyDir;
        if (e.x + e.width/2 > canvas.width - 10 || e.x - e.width/2 < 10) {
          hitEdge = true;
        }

        // Enemy shooting
        e.shootTimer--;
        if (e.shootTimer <= 0) {
          e.shootTimer = Math.random() * 240 + 120;
          if (Math.random() < 0.6) {
            enemyBullets.push({ x: e.x, y: e.y + 10, vy: 3 + wave * 0.3 });
          }
        }

        // Check if reached player
        if (e.y + e.height/2 > player.y - 10) {
          gameOver = true;
        }
      });

      if (hitEdge) {
        enemyDir = -enemyDir;
        enemies.forEach(e => e.y += 14);
      }

      // Next wave
      if (enemies.length === 0) {
        wave++;
        shields = Math.min(100, shields + 20);
        spawnWave();
        updateHUD();
      }

      // Enemy bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.y += eb.vy;
        if (eb.y > canvas.height + 10) { enemyBullets.splice(i, 1); continue; }

        // Hit player
        if (
          eb.x > player.x - player.width/2 &&
          eb.x < player.x + player.width/2 &&
          eb.y > player.y - player.height/2 &&
          eb.y < player.y + player.height/2
        ) {
          enemyBullets.splice(i, 1);
          shields -= 20;
          createExplosion(player.x, player.y, '#388bfd');
          updateHUD();
          if (shields <= 0) {
            shields = 0;
            gameOver = true;
            updateHUD();
          }
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#060911';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Bullets
      ctx.fillStyle = '#58a6ff';
      bullets.forEach(b => {
        ctx.fillRect(b.x - 2, b.y, 4, 12);
      });

      // Enemy bullets
      ctx.fillStyle = '#f85149';
      enemyBullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Enemies
      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y + e.height/2);
        ctx.lineTo(e.x - e.width/2, e.y - e.height/2);
        ctx.lineTo(e.x + e.width/2, e.y - e.height/2);
        ctx.closePath();
        ctx.fill();
      });

      // Player Ship
      if (!gameOver) {
        ctx.fillStyle = '#58a6ff';
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.height/2);
        ctx.lineTo(player.x - player.width/2, player.y + player.height/2);
        ctx.lineTo(player.x, player.y + player.height/4);
        ctx.lineTo(player.x + player.width/2, player.y + player.height/2);
        ctx.closePath();
        ctx.fill();

        // Cockpit
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(player.x, player.y - 2, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(6, 9, 17, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f85149';
        ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION FAILED', canvas.width / 2, canvas.height / 2 - 15);
        ctx.fillStyle = '#e6edf3';
        ctx.font = '16px system-ui';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
        ctx.fillStyle = '#8b949e';
        ctx.font = '13px system-ui';
        ctx.fillText('Click to Restart', canvas.width / 2, canvas.height / 2 + 45);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      if (e.key === ' ' && gameOver) resetGame();
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    canvas.addEventListener('click', () => { if (gameOver) resetGame(); });
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      player.x = (e.clientX - rect.left) * (canvas.width / rect.width);
    });
    canvas.addEventListener('mousedown', () => { player.isShooting = true; });
    window.addEventListener('mouseup', () => { player.isShooting = false; });

    resetGame();
    loop();
  </script>
</body>
</html>
