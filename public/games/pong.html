<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Cyber Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .top-controls {
      display: flex;
      justify-content: space-between;
      width: 540px;
      align-items: center;
    }
    .mode-select {
      display: flex;
      gap: 6px;
    }
    .mode-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .mode-btn.active {
      background: #388bfd;
      color: #ffffff;
      border-color: #388bfd;
    }
    .score-board {
      font-size: 26px;
      font-weight: 800;
      color: #58a6ff;
      letter-spacing: 4px;
      font-variant-numeric: tabular-nums;
    }
    canvas {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    .hint {
      font-size: 12px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-controls">
      <div class="mode-select">
        <button class="mode-btn active" id="mode-1p">1 Player vs CPU</button>
        <button class="mode-btn" id="mode-2p">2 Players</button>
      </div>
      <div class="score-board">
        <span id="score-p1">0</span> : <span id="score-p2">0</span>
      </div>
    </div>
    <canvas id="c" width="540" height="360"></canvas>
    <div class="hint" id="hint-text">P1: W/S or Mouse | Target: First to 7 points</div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const s1El = document.getElementById('score-p1');
    const s2El = document.getElementById('score-p2');
    const hintEl = document.getElementById('hint-text');

    let mode = '1p'; // '1p' or '2p'
    let score1 = 0;
    let score2 = 0;

    const PADDLE_W = 10;
    const PADDLE_H = 70;

    const p1 = { x: 20, y: 145, vy: 0, speed: 6 };
    const p2 = { x: 510, y: 145, vy: 0, speed: 6 };
    const ball = { x: 270, y: 180, r: 6, vx: 5, vy: 3 };

    let keys = {};
    let gameOver = false;
    let winner = '';

    function resetBall(servingPlayer = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * Math.PI / 4) - Math.PI / 8;
      const speed = 5.5;
      ball.vx = (servingPlayer === 1 ? -1 : 1) * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function resetGame() {
      score1 = 0;
      score2 = 0;
      gameOver = false;
      winner = '';
      p1.y = canvas.height / 2 - PADDLE_H / 2;
      p2.y = canvas.height / 2 - PADDLE_H / 2;
      resetBall();
      updateScore();
    }

    function updateScore() {
      s1El.textContent = score1;
      s2El.textContent = score2;
      if (score1 >= 7) { gameOver = true; winner = 'Player 1 Wins!'; }
      if (score2 >= 7) { gameOver = true; winner = mode === '1p' ? 'CPU Wins!' : 'Player 2 Wins!'; }
    }

    function update() {
      if (gameOver) return;

      // P1 controls (W/S or ArrowUp/Down in 1p mode)
      if (keys['w'] || keys['W'] || (mode === '1p' && keys['ArrowUp'])) p1.y -= p1.speed;
      if (keys['s'] || keys['S'] || (mode === '1p' && keys['ArrowDown'])) p1.y += p1.speed;
      p1.y = Math.max(0, Math.min(canvas.height - PADDLE_H, p1.y));

      // P2 controls (CPU or Arrow keys)
      if (mode === '2p') {
        if (keys['ArrowUp']) p2.y -= p2.speed;
        if (keys['ArrowDown']) p2.y += p2.speed;
      } else {
        // AI Tracking with slight hesitation
        const targetY = ball.y - PADDLE_H / 2;
        const diff = targetY - p2.y;
        p2.y += Math.sign(diff) * Math.min(Math.abs(diff), 4.2);
      }
      p2.y = Math.max(0, Math.min(canvas.height - PADDLE_H, p2.y));

      // Ball physics
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top / bottom bounce
      if (ball.y - ball.r < 0) {
        ball.y = ball.r;
        ball.vy = -ball.vy;
      }
      if (ball.y + ball.r > canvas.height) {
        ball.y = canvas.height - ball.r;
        ball.vy = -ball.vy;
      }

      // Left paddle collision
      if (
        ball.x - ball.r <= p1.x + PADDLE_W &&
        ball.x + ball.r >= p1.x &&
        ball.y >= p1.y &&
        ball.y <= p1.y + PADDLE_H
      ) {
        const hitOffset = (ball.y - (p1.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        ball.vx = Math.abs(ball.vx) * 1.05; // speed up slightly
        ball.vy = hitOffset * 6;
        ball.x = p1.x + PADDLE_W + ball.r;
      }

      // Right paddle collision
      if (
        ball.x + ball.r >= p2.x &&
        ball.x - ball.r <= p2.x + PADDLE_W &&
        ball.y >= p2.y &&
        ball.y <= p2.y + PADDLE_H
      ) {
        const hitOffset = (ball.y - (p2.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        ball.vx = -Math.abs(ball.vx) * 1.05;
        ball.vy = hitOffset * 6;
        ball.x = p2.x - ball.r;
      }

      // Score points
      if (ball.x < 0) {
        score2++;
        updateScore();
        resetBall(1);
      } else if (ball.x > canvas.width) {
        score1++;
        updateScore();
        resetBall(2);
      }
    }

    function draw() {
      ctx.fillStyle = '#161b22';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed net
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Paddles
      ctx.fillStyle = '#388bfd';
      ctx.fillRect(p1.x, p1.y, PADDLE_W, PADDLE_H);

      ctx.fillStyle = mode === '1p' ? '#ea580c' : '#a371f7';
      ctx.fillRect(p2.x, p2.y, PADDLE_W, PADDLE_H);

      // Draw Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      if (gameOver) {
        ctx.fillStyle = 'rgba(13, 17, 23, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#58a6ff';
        ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(winner, canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#8b949e';
        ctx.font = '14px system-ui';
        ctx.fillText('Click to Play Again', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (['ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
      p1.y = Math.max(0, Math.min(canvas.height - PADDLE_H, mouseY - PADDLE_H / 2));
    });

    canvas.addEventListener('click', () => { if (gameOver) resetGame(); });

    document.getElementById('mode-1p').onclick = () => {
      mode = '1p';
      document.getElementById('mode-1p').classList.add('active');
      document.getElementById('mode-2p').classList.remove('active');
      hintEl.textContent = 'P1: W/S or Mouse | Target: First to 7 points';
      resetGame();
    };

    document.getElementById('mode-2p').onclick = () => {
      mode = '2p';
      document.getElementById('mode-2p').classList.add('active');
      document.getElementById('mode-1p').classList.remove('active');
      hintEl.textContent = 'P1: W/S | P2: Arrow Up/Down | First to 7';
      resetGame();
    };

    resetGame();
    loop();
  </script>
</body>
</html>
